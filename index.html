<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le mie cose da fare</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6fb; color: #202638; }
    main { max-width: 620px; margin: 9vh auto; padding: 32px; background: white; border-radius: 18px; box-shadow: 0 12px 40px #28365b14; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .intro { margin: 0 0 26px; color: #606b80; }
    form { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; min-width: 0; padding: 13px; border: 1px solid #c8cfdd; border-radius: 9px; font: inherit; }
    button { border: 0; border-radius: 9px; font: inherit; cursor: pointer; }
    .add { padding: 12px 18px; background: #4c51bf; color: white; font-weight: 600; }
    .add:hover { background: #393e9b; }
    ul { list-style: none; padding: 0; margin: 24px 0 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e9edf3; }
    li label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
    li span { overflow-wrap: anywhere; }
    li.completata span { text-decoration: line-through; color: #7a8496; }
    input[type="checkbox"] { width: 19px; height: 19px; accent-color: #4c51bf; flex-shrink: 0; }
    .delete { padding: 8px 10px; background: #f7f1f2; color: #9a3645; }
    .delete:hover { background: #f2e3e5; }
    #stato { margin: 20px 0 0; color: #606b80; font-size: .9rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 660px) { main { margin: 20px 16px; padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>Le mie cose da fare</h1>
    <p class="intro">Un piccolo passo alla volta. ✨</p>
    <form id="modulo">
      <label class="visually-hidden" for="attivita">Nuova attività</label>
      <input id="attivita" type="text" placeholder="Che cosa devi fare?" maxlength="200" required autocomplete="off">
      <button class="add" type="submit">Aggiungi</button>
    </form>
    <ul id="lista" aria-label="Lista delle attività"></ul>
    <p id="stato" aria-live="polite"></p>
  </main>
  <script>
    // 1. Recuperiamo le attività salvate nel browser, se ci sono.
    const chiave = 'mie-attivita-v1';
    let attivita = [];
    try {
      const salvate = JSON.parse(localStorage.getItem(chiave) || '[]');
      if (Array.isArray(salvate)) attivita = salvate.filter(a => a && typeof a.testo === 'string' && typeof a.completata === 'boolean');
    } catch (errore) {
      console.warn('Impossibile leggere le attività salvate.', errore);
    }

    const modulo = document.querySelector('#modulo');
    const campo = document.querySelector('#attivita');
    const lista = document.querySelector('#lista');
    const stato = document.querySelector('#stato');
    let salvataggioDisponibile = true;

    // 2. Salviamo la lista ogni volta che cambia.
    function salva() {
      try {
        localStorage.setItem(chiave, JSON.stringify(attivita));
        salvataggioDisponibile = true;
      } catch (errore) {
        salvataggioDisponibile = false;
      }
    }

    // 3. Ridisegniamo la lista sullo schermo.
    function mostraLista() {
      lista.replaceChildren();
      attivita.forEach((elemento, indice) => {
        const riga = document.createElement('li');
        riga.classList.toggle('completata', elemento.completata);
        const etichetta = document.createElement('label');
        const casella = document.createElement('input');
        casella.type = 'checkbox';
        casella.checked = elemento.completata;
        casella.addEventListener('change', () => {
          attivita[indice].completata = casella.checked;
          salva();
          mostraLista();
        });
        const testo = document.createElement('span');
        testo.textContent = elemento.testo;
        etichetta.append(casella, testo);
        const elimina = document.createElement('button');
        elimina.type = 'button';
        elimina.className = 'delete';
        elimina.textContent = 'Elimina';
        elimina.setAttribute('aria-label', 'Elimina ' + elemento.testo);
        elimina.addEventListener('click', () => {
          attivita.splice(indice, 1);
          salva();
          mostraLista();
        });
        riga.append(etichetta, elimina);
        lista.append(riga);
      });
      const rimaste = attivita.filter(a => !a.completata).length;
      stato.textContent = attivita.length === 0 ? 'La lista è vuota: aggiungi la tua prima attività.' : `${rimaste} ${rimaste === 1 ? 'attività da completare' : 'attività da completare'} su ${attivita.length}.`;
      if (!salvataggioDisponibile) stato.textContent += ' Attenzione: il browser non consente il salvataggio; le modifiche potrebbero andare perse.';
    }

    // 4. Quando premiamo Aggiungi, inseriamo la nuova attività.
    modulo.addEventListener('submit', (evento) => {
      evento.preventDefault();
      const testo = campo.value.trim();
      if (!testo) { campo.focus(); return; }
      attivita.push({ testo: testo, completata: false });
      salva();
      mostraLista();
      campo.value = '';
      campo.focus();
    });
    mostraLista();
  </script>

</html>
